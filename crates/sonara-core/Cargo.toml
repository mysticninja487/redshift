[package]
name = "sonara-core"
description = "Audio engine, library, playlists and lyrics for the Sonara music player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
audiopus = "0.3.0-rc.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
lofty = "0.24.0"
ogg = "0.9.2"
parking_lot = "0.12.5"
ringbuf = "0.6.0"
rubato = "4.0.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "alac", "id3v1", "id3v2"] }
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
