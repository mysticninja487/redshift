# Builds the Windows installer on a real Windows machine. Run it from the Actions tab
# ("Run workflow") or push a tag like v0.1.0. The installer and the bare .exe are attached to the
# run as downloads; tagged builds also go on the Releases page.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # CMake 4 refuses libopus's old minimum-version line; this tells it to carry on.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the audio core
        run: cargo test -p redshift-core
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        run: cargo tauri build
      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*.exe dist/
          cp target/release/redshift.exe dist/Redshift-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Redshift-windows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
